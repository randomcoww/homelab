---
variant: fcos
version: ${butane_version}
systemd:
  units:
    - name: nftables@gateway.service
      enabled: true
storage:
  files:
    # https://blog.fhrnet.eu/2019/03/07/ecmp-on-linux/
    - path: /etc/sysctl.d/20-gateway.conf
      mode: 0644
      contents:
        inline: |
          net.ipv4.ip_forward=1
    - path: /etc/nftables/gateway.nft
      mode: 0644
      overwrite: true
      contents:
        inline: |
          table inet gateway {
            chain mark-for-accept {
              meta mark set meta mark | ${fw_mark}
            }

            chain input {
              type filter hook input priority -10; policy accept;
              iifname ${keepalived_interface_name} pkttype multicast jump mark-for-accept;
              iifname {${join(",", wan_interface_names)}} meta mark & ${fw_mark} == 0x00000000 drop;
            }

            chain forward {
              type filter hook forward priority 0; policy accept;
              oifname {${join(",", wan_interface_names)}} jump mark-for-accept;
            }

            chain postrouting {
              type nat hook postrouting priority srcnat + 20; policy accept;
              oifname {${join(",", wan_interface_names)}} masquerade;
            }
          }
          ;

    - path: ${keepalived_path}/gateway.conf
      mode: 0644
      contents:
        inline: |
          vrrp_instance gateway {
            preempt
            state BACKUP
            advert_int 0.2
            virtual_router_id ${keepalived_router_id}
            interface ${keepalived_interface_name}
            no_accept
            use_vmac
            vmac_xmit_base
            priority 100
            virtual_ipaddress {
              ${keepalived_vip}
            }
            virtual_rules {
              to all lookup ${master_default_route.table_id} priority ${master_default_route.table_priority}
            }
            virtual_routes {
              default dev ${keepalived_interface_name} table ${slave_default_route.table_id}
            }
          }
    # bird
    - path: ${bird_path}/gateway.conf
      mode: 0644
      contents:
        inline: |
          protocol kernel gateway_kernel {
            learn;
            kernel table ${slave_default_route.table_id};
            ipv4 {
              import all;
              export none;
              table ${bird_cache_table_name};
            };
          }
          %{~ for host_key, netnum in bgp_neighbor_netnums ~}
          protocol bgp ${replace(host_key, "-", "_")} {
            debug all;
            source address ${cidrhost(node_prefix, host_netnum)};
            local port ${bgp_port} as ${bgp_as_members};
            neighbor ${cidrhost(node_prefix, netnum)} port ${bgp_port} internal;
            graceful restart;
            direct;
            bfd {
            };
            ipv4 {
              import all;
              export all;
              table ${bird_cache_table_name};
            };
          }
          %{~ endfor ~}
          protocol bgp node {
            debug all;
            source address ${cidrhost(node_prefix, host_netnum)};
            local port ${bgp_port} as ${bgp_as};
            neighbor range ${node_prefix} port ${bgp_port} internal;
            graceful restart;
            direct;
            bfd {
            };
            ipv4 {
              import all;
              export all;
              table ${bird_cache_table_name};
            };
          }
          protocol bgp service {
            debug all;
            source address ${cidrhost(service_prefix, host_netnum)};
            local port ${bgp_port} as ${bgp_as};
            neighbor range ${service_prefix} port ${bgp_port} as ${bgp_as_peer};
            graceful restart;
            direct;
            bfd {
            };
            ipv4 {
              import all;
              export all;
            };
          }
    # DHCP options for WAN
    %{~ for _, interface in wan_interface_names ~}
    - path: /etc/systemd/network/20-${interface}.network.d/20-master-default-route.conf
      mode: 0644
      contents:
        inline: |
          [DHCPv4]
          RequestBroadcast=true
          ClientIdentifier=mac
          RouteTable=${master_default_route.table_id}
          UseTimezone=false
    %{~ endfor ~}